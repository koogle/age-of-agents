name: Deploy production

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: age-of-agents-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Rust
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Install asset-check dependencies
        run: python3 -m pip install --disable-pip-version-check numpy==2.4.3 Pillow==12.3.0
      - name: Verify frontend and deployment files
        run: |
          node --check frontend/app.js
          node scripts/check_directional_walk.cjs
          python3 -m py_compile modal_app.py scripts/modal_manage.py
          python3 scripts/check_depleted_asset.py

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Modal client
        run: python -m pip install --disable-pip-version-check 'modal==1.5.3'
      - name: Deploy and verify production
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python scripts/modal_manage.py deploy
