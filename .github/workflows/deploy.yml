name: Deploy production

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: age-of-agents-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Rust
        run: |
          rustup target add wasm32-unknown-unknown
          cargo fmt --all --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo clippy -p aoa-client --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Install asset-check dependencies
        run: python3 -m pip install --disable-pip-version-check numpy==2.4.3 Pillow==12.3.0
      - name: Verify web client and deployment files
        run: |
          node --input-type=module --check < web/pkg/aoa_client.js
          python3 -m py_compile modal_app.py scripts/modal_manage.py
          python3 scripts/check_sprite_resolution.py
          python3 scripts/normalize_icons.py --check

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Modal client
        run: python -m pip install --disable-pip-version-check 'modal==1.5.3'
      - name: Deploy and verify production
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python scripts/modal_manage.py deploy
