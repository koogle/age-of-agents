[workspace]
members = [".", "crates/game", "crates/client"]
resolver = "3"

[package]
name = "age-of-agents"
version = "0.1.0"
edition = "2024"

[dependencies]
aoa-game = { path = "crates/game" }
axum = { version = "0.8", features = ["ws"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Optimize the simulation without optimizing the renderer dependency graph.
# Debug assertions (including per-tick invariants) stay enabled.
[profile.test.package.aoa-game]
opt-level = 1
