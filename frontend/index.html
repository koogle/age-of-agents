<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#11180f">
  <title>Age of Agents</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #11180f; color: #f6edcf; }
    button { font: inherit; color: inherit; }
    #game { position: fixed; inset: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #resources {
      position: fixed; z-index: 3; top: 0; left: 0; right: 0; min-height: 32px;
      padding: max(6px, env(safe-area-inset-top)) 12px 6px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: linear-gradient(#171e14f2, #11170de6); border-bottom: 1px solid #77643c;
      font-size: 13px; line-height: 20px; box-shadow: 0 2px 10px #0008;
    }
    #wood strong { color: #f0ce7a; font-variant-numeric: tabular-nums; }
    #connection { color: #d9aa70; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
    #connection.online { color: #9fd37b; }
    #selection {
      position: fixed; z-index: 3; left: 10px; bottom: calc(76px + env(safe-area-inset-bottom));
      max-width: min(300px, calc(100vw - 20px)); min-height: 42px; padding: 7px 11px;
      border: 1px solid #806a3c; border-radius: 7px; background: #171b12e8;
      box-shadow: 0 4px 16px #0009; pointer-events: none;
    }
    #selection strong { display: block; color: #f4d98d; font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
    #selection span { display: block; margin-top: 2px; color: #b9b29b; font-size: 11px; text-transform: capitalize; }
    #selection.empty { color: #a9a28c; font-size: 12px; }
    #placement {
      position: fixed; z-index: 4; top: calc(43px + env(safe-area-inset-top)); left: 50%;
      transform: translateX(-50%); display: none; white-space: nowrap; padding: 7px 11px;
      border: 1px solid #d3a840; border-radius: 6px; background: #261d0eef; color: #ffe29a;
      font-size: 12px; box-shadow: 0 4px 15px #0009;
    }
    #placement.visible { display: block; }
    #toast {
      position: fixed; z-index: 5; left: 50%; bottom: calc(145px + env(safe-area-inset-bottom));
      transform: translate(-50%, 8px); opacity: 0; transition: opacity .15s, transform .15s;
      max-width: calc(100vw - 24px); padding: 8px 12px; border-radius: 6px;
      background: #151a12ed; border: 1px solid #6f694e; color: #eee4c8; font-size: 12px;
      pointer-events: none; text-align: center;
    }
    #toast.visible { opacity: 1; transform: translate(-50%, 0); }
    #dock {
      position: fixed; z-index: 4; left: 0; right: 0; bottom: 0; height: calc(66px + env(safe-area-inset-bottom));
      padding: 7px 10px calc(7px + env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 10px;
      background: linear-gradient(#171b12e8, #0c100be8); border-top: 1px solid #75613a; box-shadow: 0 -3px 14px #0008;
    }
    .command {
      position: relative; width: 52px; height: 52px; padding: 2px; overflow: hidden;
      border: 1px solid #8e7746; border-radius: 7px; background: #252616; box-shadow: inset 0 0 0 1px #0008;
      cursor: pointer; touch-action: manipulation;
    }
    .command img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; display: block; }
    .command span { position: absolute; left: 2px; right: 2px; bottom: 2px; padding: 2px; background: #111c; font-size: 9px; line-height: 11px; }
    .command:active, .command.active { transform: translateY(1px); border-color: #f1c557; box-shadow: 0 0 0 2px #e5b94455; }
    .command:disabled { filter: grayscale(1); opacity: .45; cursor: default; }
    #cancel { display: none; }
    #cancel.visible { display: block; }
    #laptop-help { display: none; }
    @media (min-width: 900px) and (hover: hover) and (pointer: fine) {
      #laptop-help {
        position: fixed; z-index: 4; top: 42px; right: 14px; display: block;
        width: 210px; border: 1px solid #75613a; border-radius: 7px;
        background: #171b12e8; color: #cfc6aa; box-shadow: 0 4px 14px #0008;
        font-size: 11px; line-height: 1.45;
      }
      #laptop-help summary { padding: 6px 9px; color: #f0d58b; cursor: pointer; }
      #laptop-help p { margin: 0; padding: 0 9px 8px; }
      #placement { top: 43px; }
    }
    @media (min-width: 700px) {
      #resources { padding-left: 18px; padding-right: 18px; }
      #selection { left: 18px; bottom: calc(84px + env(safe-area-inset-bottom)); }
      #dock { left: 50%; right: auto; bottom: 14px; width: auto; height: 66px; padding: 7px; transform: translateX(-50%); border: 1px solid #75613a; border-radius: 9px; }
    }
  </style>
</head>
<body>
  <main id="game" aria-label="Isometric game world"><canvas id="world"></canvas></main>
  <header id="resources"><span id="wood">Wood <strong>0</strong></span><span id="connection">Connecting</span></header>
  <aside id="selection" class="empty">Tap a villager to select</aside>
  <div id="placement">Tap ground to build · Escape to cancel</div>
  <div id="toast" role="status" aria-live="polite"></div>
  <details id="laptop-help"><summary>Keyboard &amp; mouse</summary><p>WASD or arrows pan · Wheel zooms · B builds · Escape cancels</p></details>
  <nav id="dock" aria-label="Unit commands">
    <button id="build" class="command" disabled aria-label="Build town center" title="Build town center"><img src="/assets/game/command_build.png" alt=""><span>Build</span></button>
    <button id="cancel" class="command" aria-label="Cancel placement" title="Cancel placement"><img src="/assets/game/command_cancel.png" alt=""><span>Cancel</span></button>
  </nav>
  <script src="/frontend/app.js"></script>
</body>
</html>
