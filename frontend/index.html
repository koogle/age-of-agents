<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Age of Agents</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0c0c1a;
    color: #c8c8d8;
    font-family: 'Georgia', 'Palatino Linotype', 'Book Antiqua', serif;
    overflow: hidden;
    display: flex;
    height: 100vh;
    cursor: default;
  }

  #canvas-container {
    flex: 1;
    position: relative;
    overflow: hidden;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #canvas-container canvas { display: block; }

  /* ── Minimap ────────────────────────────────────────────── */
  #minimap-container {
    position: absolute;
    bottom: 12px;
    right: 12px;
    width: 160px;
    height: 120px;
    border: 2px solid #5a3a1a;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 0 16px rgba(0,0,0,0.8);
    cursor: crosshair;
    z-index: 10;
    background: #1a1a0a;
  }
  #minimap-container canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  /* ── Label overlay ──────────────────────────────────────── */
  #label-container {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 5;
  }
  .agent-label {
    position: absolute;
    color: #ddd;
    font-size: 11px;
    font-family: 'Georgia', serif;
    text-shadow: 0 0 6px #000, 0 0 3px #000, 1px 1px 2px #000;
    white-space: nowrap;
    pointer-events: none;
    transform: translate(-50%, -100%);
    padding: 2px 6px;
    background: rgba(0,0,0,0.5);
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.08);
    transition: opacity 0.15s;
  }
  .agent-label.selected {
    color: #ffcc44;
    border-color: #ffcc44;
    box-shadow: 0 0 8px rgba(255,204,68,0.3);
  }

  /* ── HUD ────────────────────────────────────────────────── */
  #hud {
    width: 270px;
    background: linear-gradient(180deg, rgba(16,12,28,0.97) 0%, rgba(10,8,20,0.97) 100%);
    border-left: 2px solid #3a2a1a;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow-y: auto;
    font-size: 13px;
    z-index: 20;
    box-shadow: -4px 0 20px rgba(0,0,0,0.6);
  }
  #hud::-webkit-scrollbar { width: 4px; }
  #hud::-webkit-scrollbar-thumb { background: #3a2a1a; border-radius: 2px; }

  #hud .panel-title {
    font-size: 15px;
    color: #d4a846;
    border-bottom: 1px solid #3a2a1a;
    padding-bottom: 5px;
    margin-bottom: 4px;
    letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(212,168,70,0.15);
  }
  #hud .panel-title small { font-size: 10px; color: #776644; letter-spacing: 0; }

  #tick-info {
    font-size: 11px;
    color: #887755;
    font-family: monospace;
    margin-bottom: 4px;
  }

  .section-label {
    font-size: 11px;
    color: #887755;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 6px;
    margin-bottom: 2px;
  }

  .agent-card {
    background: rgba(255,255,255,0.03);
    border-radius: 6px;
    padding: 7px 10px;
    margin-bottom: 3px;
    cursor: pointer;
    transition: all 0.15s;
    border: 1px solid transparent;
  }
  .agent-card:hover { background: rgba(255,255,255,0.07); }
  .agent-card.selected {
    background: rgba(212,168,70,0.10);
    border-color: rgba(212,168,70,0.3);
  }
  .agent-card .name { font-weight: bold; font-size: 13px; }
  .agent-card .status { font-size: 10px; opacity: 0.6; margin-top: 1px; font-family: monospace; }
  .agent-card .resources { font-size: 10px; margin-top: 2px; color: #998866; }
  .agent-card .health-bar {
    height: 3px; background: #221a0a; border-radius: 2px; margin-top: 4px; overflow: hidden;
  }
  .agent-card .health-bar .fill {
    height: 100%; border-radius: 2px; transition: width 0.3s;
  }

  #resource-count {
    font-size: 11px;
    color: #998866;
    padding: 4px 0;
  }
  #resource-count span { margin-right: 10px; }

  #controls {
    display: flex;
    gap: 6px;
    margin-top: 6px;
    flex-wrap: wrap;
  }
  #controls button {
    background: #1a1428;
    color: #b8a878;
    border: 1px solid #3a2a1a;
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    font-family: 'Georgia', serif;
    transition: all 0.15s;
  }
  #controls button:hover {
    background: #2a1e3a;
    border-color: #6a4a2a;
    color: #d4c888;
  }

  #event-log-container {
    margin-top: auto;
    padding-top: 4px;
    border-top: 1px solid #2a1a0a;
  }
  #event-log {
    font-size: 10px;
    color: #776655;
    font-family: monospace;
    max-height: 100px;
    overflow-y: auto;
  }
  #event-log::-webkit-scrollbar { width: 3px; }
  #event-log::-webkit-scrollbar-thumb { background: #3a2a1a; border-radius: 2px; }
  #event-log div { padding: 1px 0; opacity: 0.8; }
  #event-log div:nth-child(odd) { opacity: 0.5; }

  /* ── Connection indicator ───────────────────────────────── */
  #conn-status {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    z-index: 15;
    pointer-events: none;
    transition: background 0.3s;
  }
  #conn-status.connected { background: #44cc66; box-shadow: 0 0 8px rgba(68,204,102,0.4); }
  #conn-status.disconnected { background: #cc4444; box-shadow: 0 0 8px rgba(204,68,68,0.4); }
  #conn-status.connecting { background: #ccaa44; box-shadow: 0 0 8px rgba(204,170,68,0.4); }

  /* ── HUD toggle (hidden on desktop) ─────────────────────── */
  #hud-toggle { display: none; }

  /* ── Mobile responsive ──────────────────────────────────── */
  @media (max-width: 768px) {
    body {
      flex-direction: column;
    }

    #canvas-container {
      width: 100%;
      height: 100vh;
    }

    #minimap-container {
      width: 100px;
      height: 75px;
      bottom: 56px;
      right: 8px;
    }

    #hud {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: auto;
      max-height: 55vh;
      border-left: none;
      border-top: 2px solid #3a2a1a;
      border-radius: 12px 12px 0 0;
      padding: 0;
      font-size: 11px;
      z-index: 30;
      overflow: visible;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.6);
      transform: translateY(calc(100% - 44px));
      transition: transform 0.3s ease;
    }
    #hud.expanded {
      transform: translateY(0);
      overflow-y: auto;
    }

    #hud-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      cursor: pointer;
      min-height: 44px;
      background: linear-gradient(180deg, rgba(16,12,28,0.97), rgba(10,8,20,0.97));
      border-radius: 12px 12px 0 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
    }
    #hud-toggle .toggle-arrow {
      transition: transform 0.3s;
      font-size: 14px;
      color: #d4a846;
    }
    #hud.expanded #hud-toggle .toggle-arrow {
      transform: rotate(180deg);
    }
    #hud-tick-mini {
      font-size: 10px;
      color: #887755;
      font-family: monospace;
      flex: 1;
    }

    #hud-content {
      padding: 0 14px 14px;
      overflow-y: auto;
      max-height: calc(55vh - 44px);
    }
    #hud.expanded #hud-content {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Labels larger on mobile */
    .agent-label {
      font-size: 13px;
    }

    /* Smaller HUD text on mobile */
    #hud .panel-title { font-size: 13px; }
    #hud .panel-title small { font-size: 9px; }
    .section-label { font-size: 10px; }
    .agent-card .name { font-size: 11px; }
    .agent-card .status { font-size: 9px; }
    .agent-card .resources { font-size: 9px; }
    #tick-info { font-size: 10px; }
    #resource-count { font-size: 10px; }
    #controls button { font-size: 10px; padding: 6px 10px; }
    #event-log { font-size: 9px; }
    #event-log { max-height: 80px; }

    /* Controls bar at bottom of expanded HUD */
    #controls {
      position: sticky;
      bottom: 0;
      background: rgba(10,8,20,0.95);
      padding: 8px 0 4px;
      margin-top: 6px;
      margin-bottom: 0;
      border-top: 1px solid #2a1a0a;
    }
  }
</style>
</head>
<body>

<div id="canvas-container">
  <div id="conn-status" class="disconnected"></div>
  <div id="minimap-container"><canvas id="minimap-canvas" width="320" height="240"></canvas></div>
  <div id="label-container"></div>
</div>

<div id="hud">
  <div id="hud-toggle">
    <span id="hud-tick-mini">Tick: 0 | Time: 0.0s | Agents: 0</span>
    <span class="toggle-arrow">▼</span>
  </div>
  <div id="hud-content">
    <div class="panel-title">🏰 Age of Agents <small>v2</small></div>
    <div id="tick-info">Tick: 0 &nbsp;|&nbsp; Time: 0.0s &nbsp;|&nbsp; Agents: 0</div>

    <div class="section-label">⚔️ Warband</div>
    <div id="agent-list"></div>

    <div class="section-label">📦 Resources</div>
    <div id="resource-count"></div>

    <div id="controls">
      <button onclick="resetWorld()">🔄 Reset</button>
      <button onclick="window.selectedAgentId=null;document.querySelectorAll('.agent-card.selected').forEach(e=>e.classList.remove('selected'));updateScene()">✕ Deselect</button>
    </div>

    <div id="event-log-container">
      <div class="section-label" style="margin-top:0">📜 Chronicle</div>
      <div id="event-log"><div>— awaiting dispatch —</div></div>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Sprite textures ─────────────────────────────────────────────────────
const spriteTextures = {};

function createChromaKeyTexture(url) {
  const texture = new THREE.CanvasTexture(createPlaceholderCanvas());
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;

  // Store a promise so we can wait for all textures before starting the game
  texture.userData.ready = new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
          if (data[i] > 240 && data[i + 1] > 240 && data[i + 2] > 240) {
            data[i + 3] = 0;
          }
        }
        ctx.putImageData(imageData, 0, 0);
        texture.image = canvas;
        texture.needsUpdate = true;
      } catch (e) {
        console.warn('Chroma-key failed for', url, e);
      }
      resolve(true);
    };
    img.onerror = () => {
      console.warn('Failed to load sprite:', url);
      resolve(false);
    };
    img.src = url;
  });
  return texture;
}

// 1×1 dark placeholder so the scene is visible before textures arrive
function createPlaceholderCanvas() {
  const c = document.createElement('canvas');
  c.width = 2;
  c.height = 2;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#5a7a4a';
  ctx.fillRect(0, 0, 2, 2);
  return c;
}

// Pre-load all sprite textures at startup
{
  const paths = {
    agentIdle: '/assets/isometric/iso_agent_idle.png',
    agentWalk1: '/assets/isometric/iso_agent_walk1.png',
    agentWalk2: '/assets/isometric/iso_agent_walk2.png',
    agentGather: '/assets/isometric/iso_agent_gather.png',
    tree: '/assets/isometric/iso_tree.png',
    gold: '/assets/isometric/iso_gold.png',
    food: '/assets/isometric/iso_bush.png',
    townCenter: '/assets/isometric/iso_towncenter.png',
    grass: '/assets/isometric/iso_grass.png',
    dirt: '/assets/isometric/iso_dirt.png',
    water: '/assets/isometric/iso_water.png',
  };
  for (const [key, url] of Object.entries(paths)) {
    spriteTextures[key] = createChromaKeyTexture(url);
  }
}

// Promise that resolves when all sprite textures are loaded (or failed)
const allTexturesReady = Promise.all(
  Object.values(spriteTextures).map(t => t.userData.ready)
);

// ── DOM refs ────────────────────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const labelContainer = document.getElementById('label-container');
const eventLog = document.getElementById('event-log');
const agentList = document.getElementById('agent-list');
const tickInfo = document.getElementById('tick-info');
const resourceCount = document.getElementById('resource-count');
const connStatus = document.getElementById('conn-status');
const minimapCanvas = document.getElementById('minimap-canvas');
const minimapCtx = minimapCanvas.getContext('2d');
const hud = document.getElementById('hud');
const hudToggle = document.getElementById('hud-toggle');
const hudTickMini = document.getElementById('hud-tick-mini');

// ── HUD toggle (mobile) ─────────────────────────────────────────────────
function toggleHud() {
  hud.classList.toggle('expanded');
}
hudToggle.addEventListener('click', toggleHud);

// ── Scene setup ─────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1520);

// Orthographic camera for a fixed isometric view
const VIEW_FRUSTUM = 720;
const camera = new THREE.OrthographicCamera(
  -VIEW_FRUSTUM, VIEW_FRUSTUM,
  VIEW_FRUSTUM, -VIEW_FRUSTUM,
  1, 4000
);
camera.position.set(600, 800, 600);
camera.lookAt(600, 0, 400);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(600, 0, 400);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enableRotate = false; // isometric: rotation disabled, pan + zoom only
controls.mouseButtons = {
  MIDDLE: THREE.MOUSE.PAN,
  LEFT: null,
  RIGHT: null
};
controls.touches = {
  ONE: THREE.TOUCH.PAN,
  TWO: THREE.TOUCH.DOLLY_PAN
};
controls.zoomSpeed = 1.2;
controls.minZoom = 0.25;
controls.maxZoom = 4;
controls.update();

// ── Ground — isometric tile grid ────────────────────────────────────────
// 20x15 grid of 60px tiles (1200x800 world area, centered on the camera target)
const TILE_SIZE = 60;
const GRID_COLS = 20;
const GRID_ROWS = 15;
const GRID_ORIGIN_X = 0;
const GRID_ORIGIN_Z = 0;

// Chroma-keyed tile textures with nearest filtering for a crisp pixel-art look
for (const key of ['grass', 'dirt', 'water']) {
  spriteTextures[key].minFilter = THREE.NearestFilter;
  spriteTextures[key].magFilter = THREE.NearestFilter;
  spriteTextures[key].generateMipmaps = false;
}

function tileTypeAt(col, row) {
  // Water fills the north-west corner (a lake), dirt a diagonal path,
  // everything else is grass
  const x = col * TILE_SIZE;
  const z = row * TILE_SIZE;
  if (x < 300 && z < 240) return 'water';
  if ((col + row) % 7 === 0) return 'dirt';
  return 'grass';
}

function buildGround() {
  const geo = new THREE.PlaneGeometry(TILE_SIZE, TILE_SIZE);

  // Group tiles by type into InstancedMeshes
  const byType = { grass: [], dirt: [], water: [] };
  for (let row = 0; row < GRID_ROWS; row++) {
    for (let col = 0; col < GRID_COLS; col++) {
      byType[tileTypeAt(col, row)].push({
        x: GRID_ORIGIN_X + col * TILE_SIZE + TILE_SIZE / 2,
        z: GRID_ORIGIN_Z + row * TILE_SIZE + TILE_SIZE / 2
      });
    }
  }

  const dummy = new THREE.Object3D();
  for (const type of ['grass', 'dirt', 'water']) {
    const tiles = byType[type];
    if (tiles.length === 0) continue;
    const inst = new THREE.InstancedMesh(geo, new THREE.MeshBasicMaterial({ map: spriteTextures[type] }), tiles.length);
    inst.userData.isGround = true;
    tiles.forEach((t, i) => {
      dummy.position.set(t.x, -0.5, t.z);
      dummy.rotation.set(-Math.PI / 2, 0, 0);
      dummy.updateMatrix();
      inst.setMatrixAt(i, dummy.matrix);
    });
    inst.instanceMatrix.needsUpdate = true;
    scene.add(inst);
  }
}
buildGround();

// ── Raycaster for click events ──────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const mouse = new THREE.Vector2();

// ── Double-tap tracking ─────────────────────────────────────────────────
let lastTapTime = 0;
let lastTapX = 0;
let lastTapY = 0;
const DOUBLE_TAP_DELAY = 300;
const DOUBLE_TAP_DIST = 30;

// ── Game objects ────────────────────────────────────────────────────────
const agentMeshes = new Map();  // id -> {group, ring, label, targetMarker, data}
const resourceMeshes = new Map();
const buildingMeshes = new Map();
let selectedAgentId = null;
let world = { agents: {}, resources: [], buildings: [], tick: 0, time: 0, events: [] };

// ── Mesh creation ──────────────────────────────────────────────────────

function createAgentMesh(color) {
  const group = new THREE.Group();

  // Agent sprite — billboard always faces camera
  const spriteMat = new THREE.SpriteMaterial({
    map: spriteTextures.agentIdle,
    transparent: true,
    depthTest: true,
    depthWrite: false,
  });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.scale.set(40, 40, 1);
  sprite.position.y = 20;
  group.add(sprite);

  // Store sprite ref for animation
  group.userData.sprite = sprite;
  group.userData.lastAnimSwap = 0;
  group.userData.currentFrame = 0;

  // Selection ring — bright and visible
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(10, 13, 32),
    new THREE.MeshBasicMaterial({
      color: 0xffcc44,
      transparent: true,
      opacity: 0,
      side: THREE.DoubleSide,
      depthWrite: false
    })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.3;
  group.add(ring);

  // Glow ring (outer)
  const glowRing = new THREE.Mesh(
    new THREE.RingGeometry(13, 16, 32),
    new THREE.MeshBasicMaterial({
      color: 0xffaa00,
      transparent: true,
      opacity: 0,
      side: THREE.DoubleSide,
      depthWrite: false
    })
  );
  glowRing.rotation.x = -Math.PI / 2;
  glowRing.position.y = 0.2;
  group.add(glowRing);

  return group;
}

function createTargetMarker() {
  const group = new THREE.Group();

  // Cross marker — flat on the ground
  const crossMat = new THREE.MeshBasicMaterial({
    color: 0xffcc44,
    transparent: true,
    opacity: 0.8,
    depthWrite: false,
    side: THREE.DoubleSide,
  });

  // Four bars pointing outward
  for (let i = 0; i < 4; i++) {
    const angle = (i / 4) * Math.PI * 2;
    const bar = new THREE.Mesh(
      new THREE.PlaneGeometry(3, 8),
      crossMat
    );
    bar.position.set(Math.cos(angle) * 5, 0.5, Math.sin(angle) * 5);
    bar.rotation.set(-Math.PI / 2, 0, -angle);
    group.add(bar);
  }

  // Center dot
  const dot = new THREE.Mesh(
    new THREE.CircleGeometry(2, 8),
    new THREE.MeshBasicMaterial({ color: 0xffcc44, transparent: true, opacity: 0.5, depthWrite: false, side: THREE.DoubleSide })
  );
  dot.rotation.x = -Math.PI / 2;
  dot.position.y = 0.5;
  group.add(dot);

  return group;
}

function createResourceMesh(kind) {
  let texKey, scale;
  if (kind === 'wood' || kind === 'tree') {
    texKey = 'tree';
    scale = 35;
  } else if (kind === 'gold') {
    texKey = 'gold';
    scale = 28;
  } else if (kind === 'food') {
    texKey = 'food';
    scale = 30;
  } else {
    texKey = 'tree';
    scale = 30;
  }

  const group = new THREE.Group();

  // Billboard sprite — always faces camera
  const mat = new THREE.SpriteMaterial({
    map: spriteTextures[texKey],
    transparent: true,
    depthTest: true,
    depthWrite: false,
  });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(scale, scale, 1);
  sprite.position.y = 10;
  group.add(sprite);

  return group;
}

function createBuildingMesh(kind) {
  const group = new THREE.Group();

  if (kind === 'town_center') {
    // Billboard sprite — always faces camera
    const mat = new THREE.SpriteMaterial({
      map: spriteTextures.townCenter,
      transparent: true,
      depthWrite: false,
    });
    const sprite = new THREE.Sprite(mat);
    sprite.scale.set(80, 80, 1);
    sprite.position.y = 20;
    group.add(sprite);
  }

  return group;
}

// ── Label helpers ──────────────────────────────────────────────────────

function createLabelElement(id, name, color) {
  const el = document.createElement('div');
  el.className = 'agent-label';
  el.id = 'label-' + id;
  el.textContent = name;
  el.style.color = color || '#ddd';
  return el;
}

function updateLabelPosition(el, worldPos) {
  const vec = worldPos.clone();
  vec.y += 28; // above the agent
  vec.project(camera);

  const w = container.clientWidth;
  const h = container.clientHeight;
  const x = (vec.x * 0.5 + 0.5) * w;
  const y = (-vec.y * 0.5 + 0.5) * h;

  if (vec.z > 1) {
    el.style.display = 'none';
    return;
  }
  el.style.display = '';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
}

// ── Scene update ────────────────────────────────────────────────────────

function updateScene() {
  const worldPos = new THREE.Vector3();

  // Agents
  const activeAgentIds = new Set(Object.keys(world.agents));
  for (const [id, obj] of agentMeshes) {
    if (!activeAgentIds.has(id)) {
      scene.remove(obj.group);
      if (obj.label && obj.label.parentNode) obj.label.parentNode.removeChild(obj.label);
      if (obj.targetMarker) scene.remove(obj.targetMarker);
      agentMeshes.delete(id);
    }
  }

  for (const [id, data] of Object.entries(world.agents)) {
    let obj = agentMeshes.get(id);
    if (!obj) {
      const group = createAgentMesh(data.color);
      scene.add(group);
      const label = createLabelElement(id, data.name || 'Peasant', data.color);
      labelContainer.appendChild(label);
      const targetMarker = createTargetMarker();
      targetMarker.visible = false;
      scene.add(targetMarker);
      obj = { group, label, targetMarker };
      agentMeshes.set(id, obj);
    }

    const { group, label, targetMarker } = obj;
    group.position.set(data.x, 0, data.z !== undefined ? data.z : data.y);

    // Sprite animation: cycle idle/walk1/walk2 based on action state
    if (group.userData.sprite) {
      const action = data.action || data.state || 'idle';
      let frameKey;
      if (action === 'gather') {
        frameKey = 'agentGather';
      } else if (action === 'move_to' || data.state === 'moving') {
        const now = Date.now();
        if (!group.userData.lastAnimSwap) group.userData.lastAnimSwap = now;
        if (now - group.userData.lastAnimSwap > 250) {
          group.userData.currentFrame = ((group.userData.currentFrame || 0) + 1) % 2;
          group.userData.lastAnimSwap = now;
        }
        frameKey = group.userData.currentFrame === 0 ? 'agentWalk1' : 'agentWalk2';
      } else {
        frameKey = 'agentIdle';
      }
      const tex = spriteTextures[frameKey];
      if (group.userData.sprite.material.map !== tex) {
        group.userData.sprite.material.map = tex;
        group.userData.sprite.material.needsUpdate = true;
      }
    }

    // Selection ring
    const ring = group.children.find(c => c.geometry && c.geometry.type === 'RingGeometry' && c.material.opacity !== undefined);
    const glowRing = group.children.find(c => c.geometry && c.geometry.type === 'RingGeometry' && c !== ring);
    const isSelected = id === selectedAgentId;

    if (ring) {
      ring.material.opacity = isSelected ? 1.0 : 0;
      ring.scale.setScalar(isSelected ? 1.0 : 0.8);
    }
    if (glowRing) {
      const pulse = 0.4 + 0.3 * Math.sin(Date.now() / 300);
      glowRing.material.opacity = isSelected ? pulse : 0;
    }

    // Label
    label.className = 'agent-label' + (isSelected ? ' selected' : '');
    worldPos.set(data.x, 0, data.z !== undefined ? data.z : data.y);
    updateLabelPosition(label, worldPos);

    // Target marker for move orders
    if (data.state === 'active' && data.action === 'move_to' && data.target_x !== undefined) {
      targetMarker.visible = true;
      targetMarker.position.set(data.target_x, 0, data.target_z !== undefined ? data.target_z : data.target_y);
      targetMarker.rotation.y = Date.now() / 1000;
    } else {
      targetMarker.visible = false;
    }
  }

  // Resources
  const activeResIds = new Set(world.resources.map(r => r.id));
  for (const [id, mesh] of resourceMeshes) {
    if (!activeResIds.has(id)) { scene.remove(mesh); resourceMeshes.delete(id); }
  }
  for (const r of world.resources) {
    let mesh = resourceMeshes.get(r.id);
    if (!mesh) {
      mesh = createResourceMesh(r.kind);
      scene.add(mesh);
      resourceMeshes.set(r.id, mesh);
    }
    mesh.position.set(r.x, 0, r.y !== undefined ? r.y : r.z !== undefined ? r.z : 0);
    const s = 0.3 + 0.7 * ((r.amount || 100) / 100);
    mesh.scale.set(s, s, s);
    mesh.userData.resourceId = r.id;
    mesh.userData.isResource = true;
  }

  // Buildings
  const activeBuildIds = new Set(world.buildings.map(b => b.id));
  for (const [id, mesh] of buildingMeshes) {
    if (!activeBuildIds.has(id)) { scene.remove(mesh); buildingMeshes.delete(id); }
  }
  for (const b of world.buildings) {
    let mesh = buildingMeshes.get(b.id);
    if (!mesh) {
      mesh = createBuildingMesh(b.kind);
      scene.add(mesh);
      buildingMeshes.set(b.id, mesh);
    }
    mesh.position.set(b.x, 0, b.y !== undefined ? b.y : b.z !== undefined ? b.z : 0);
    mesh.userData.buildingId = b.id;
    mesh.userData.isBuilding = true;
  }

  updateMinimap();
}

// ── Minimap ─────────────────────────────────────────────────────────────

const MINIMAP_W = 320;
const MINIMAP_H = 240;

function updateMinimap() {
  const ctx = minimapCtx;
  ctx.fillStyle = '#1a1a0a';
  ctx.fillRect(0, 0, MINIMAP_W, MINIMAP_H);

  // Determine bounds from world data
  let minX = Infinity, maxX = -Infinity;
  let minZ = Infinity, maxZ = -Infinity;

  for (const a of Object.values(world.agents)) {
    const z = a.z !== undefined ? a.z : a.y;
    if (a.x < minX) minX = a.x;
    if (a.x > maxX) maxX = a.x;
    if (z < minZ) minZ = z;
    if (z > maxZ) maxZ = z;
  }
  for (const r of (world.resources || [])) {
    const z = r.y !== undefined ? r.y : (r.z !== undefined ? r.z : 0);
    if (r.x < minX) minX = r.x;
    if (r.x > maxX) maxX = r.x;
    if (z < minZ) minZ = z;
    if (z > maxZ) maxZ = z;
  }
  for (const b of (world.buildings || [])) {
    const z = b.y !== undefined ? b.y : (b.z !== undefined ? b.z : 0);
    if (b.x < minX) minX = b.x;
    if (b.x > maxX) maxX = b.x;
    if (z < minZ) minZ = z;
    if (z > maxZ) maxZ = z;
  }

  // Fallback bounds
  if (!isFinite(minX)) { minX = 0; maxX = 1200; minZ = 0; maxZ = 800; }
  const rangeX = maxX - minX || 1;
  const rangeZ = maxZ - minZ || 1;

  const pad = 8;
  const drawW = MINIMAP_W - pad * 2;
  const drawH = MINIMAP_H - pad * 2;

  const toScreen = (x, z) => ({
    sx: pad + ((x - minX) / rangeX) * drawW,
    sy: pad + ((z - minZ) / rangeZ) * drawH
  });

  // Draw grid lines
  ctx.strokeStyle = '#2a2a1a';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const t = i / 4;
    ctx.beginPath();
    ctx.moveTo(pad + t * drawW, pad);
    ctx.lineTo(pad + t * drawW, pad + drawH);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(pad, pad + t * drawH);
    ctx.lineTo(pad + drawW, pad + t * drawH);
    ctx.stroke();
  }

  // Buildings (squares)
  for (const b of (world.buildings || [])) {
    const z = b.y !== undefined ? b.y : (b.z !== undefined ? b.z : 0);
    const { sx, sy } = toScreen(b.x, z);
    ctx.fillStyle = '#887766';
    ctx.fillRect(sx - 3, sy - 3, 6, 6);
    ctx.fillStyle = '#aa9988';
    ctx.fillRect(sx - 2, sy - 2, 4, 4);
  }

  // Resources (small dots)
  const resColors = { wood: '#4a7a3a', gold: '#ffaa33', food: '#cc6644', stone: '#888888' };
  for (const r of (world.resources || [])) {
    const z = r.y !== undefined ? r.y : (r.z !== undefined ? r.z : 0);
    const { sx, sy } = toScreen(r.x, z);
    ctx.fillStyle = resColors[r.kind] || '#888';
    ctx.beginPath();
    ctx.arc(sx, sy, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Agents (bright dots)
  for (const [id, a] of Object.entries(world.agents)) {
    const z = a.z !== undefined ? a.z : a.y;
    const { sx, sy } = toScreen(a.x, z);
    ctx.fillStyle = a.color || '#88aaff';
    ctx.beginPath();
    ctx.arc(sx, sy, 3, 0, Math.PI * 2);
    ctx.fill();

    // Selected agent highlight
    if (id === selectedAgentId) {
      ctx.strokeStyle = '#ffcc44';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sx, sy, 5, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // Camera frustum
  const frustum = getCameraFrustum();
  if (frustum) {
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < frustum.length; i++) {
      const { sx, sy } = toScreen(frustum[i][0], frustum[i][1]);
      i === 0 ? ctx.moveTo(sx, sy) : ctx.lineTo(sx, sy);
    }
    ctx.closePath();
    ctx.stroke();
  }

  // Border
  ctx.strokeStyle = '#5a3a1a';
  ctx.lineWidth = 2;
  ctx.strokeRect(0, 0, MINIMAP_W, MINIMAP_H);
}

function getCameraFrustum() {
  // Orthographic camera frustum corners on the ground plane (y=0)
  const aspect = (camera.right - camera.left) / (camera.top - camera.bottom);
  const halfH = camera.top;
  const halfW = camera.right * (camera.right / camera.top);

  // Camera forward and right vectors on the XZ plane
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  dir.y = 0;
  dir.normalize();

  const right = new THREE.Vector3();
  right.crossVectors(dir, new THREE.Vector3(0, 1, 0)).normalize();

  const center = new THREE.Vector3(controls.target.x, 0, controls.target.z);

  return [
    [center.x + dir.x * 400 - right.x * halfW, center.z + dir.z * 400 - right.z * halfW],
    [center.x + dir.x * 400 + right.x * halfW, center.z + dir.z * 400 + right.z * halfW],
    [center.x - dir.x * 400 + right.x * halfW, center.z - dir.z * 400 + right.z * halfW],
    [center.x - dir.x * 400 - right.x * halfW, center.z - dir.z * 400 - right.z * halfW]
  ];
}

// ── HUD update ──────────────────────────────────────────────────────────

function updateHUD() {
  const agentCount = Object.keys(world.agents).length;
  const tickStr = `Tick: ${world.tick} | Time: ${(world.time || 0).toFixed(1)}s | Agents: ${agentCount}`;
  tickInfo.textContent = tickStr;
  hudTickMini.textContent = tickStr;

  // Agent cards
  agentList.innerHTML = '';
  for (const [id, a] of Object.entries(world.agents)) {
    const card = document.createElement('div');
    card.className = 'agent-card' + (id === selectedAgentId ? ' selected' : '');
    card.dataset.agentId = id;

    const healthPct = Math.round(a.health);
    const healthColor = healthPct > 60 ? '#44cc66' : healthPct > 30 ? '#ccaa44' : '#cc4444';
    const statusText = a.state + (a.action ? ' → ' + a.action : '');

    card.innerHTML = `
      <div class="name" style="color:${a.color || '#88aaff'}">${a.name || 'Peasant'}</div>
      <div class="status">${statusText}${a.target_x !== undefined && a.action === 'move_to' ? ' 🎯' : ''}</div>
      <div class="resources">🪵${a.wood||0} 🪙${a.gold||0} 🪨${a.stone||0} 🍖${a.food||0}</div>
      <div class="health-bar"><div class="fill" style="width:${healthPct}%;background:${healthColor}"></div></div>
    `;

    card.addEventListener('click', () => {
      selectAgent(id);
    });

    agentList.appendChild(card);
  }

  // Resource counts
  if (world.resources) {
    const counts = {};
    for (const r of world.resources) {
      counts[r.kind] = (counts[r.kind] || 0) + 1;
    }
    resourceCount.innerHTML = Object.entries(counts)
      .map(([k, v]) => `<span>${k}: ${v}</span>`)
      .join('');
  } else {
    resourceCount.innerHTML = '';
  }

  // Events
  if (world.events && world.events.length > 0) {
    for (const ev of world.events.slice(-5)) {
      const el = document.createElement('div');
      if (typeof ev === 'string') {
        el.textContent = ev;
      } else if (ev.message) {
        el.textContent = ev.message;
      } else {
        el.textContent = JSON.stringify(ev);
      }
      eventLog.appendChild(el);
    }
    while (eventLog.children.length > 50) eventLog.removeChild(eventLog.firstChild);
    eventLog.scrollTop = eventLog.scrollHeight;
  }
}

// ── Selection ──────────────────────────────────────────────────────────

function selectAgent(id) {
  selectedAgentId = id;

  // Update UI classes
  document.querySelectorAll('.agent-card.selected').forEach(e => e.classList.remove('selected'));
  const card = document.querySelector(`.agent-card[data-agent-id="${id}"]`);
  if (card) card.classList.add('selected');

  updateScene();
}

function getClickableObjects() {
  const objects = [];
  for (const [id, obj] of agentMeshes) {
    obj.group.children.forEach(child => {
      child.userData.agentId = id;
      child.userData.isAgent = true;
      objects.push(child);
    });
  }
  for (const [id, mesh] of resourceMeshes) {
    mesh.children.forEach(child => {
      child.userData.resourceId = id;
      child.userData.isResource = true;
      objects.push(child);
    });
    mesh.userData.resourceId = id;
    mesh.userData.isResource = true;
    objects.push(mesh);
  }
  for (const [id, mesh] of buildingMeshes) {
    mesh.children.forEach(child => {
      child.userData.buildingId = id;
      child.userData.isBuilding = true;
      objects.push(child);
    });
    mesh.userData.buildingId = id;
    mesh.userData.isBuilding = true;
    objects.push(mesh);
  }
  // Also add group roots
  for (const [id, obj] of agentMeshes) {
    obj.group.userData.agentId = id;
    obj.group.userData.isAgent = true;
    objects.push(obj.group);
  }
  return objects;
}

// ── Helper: send command (move or gather) ───────────────────────────────
function sendMoveCommand(agentId, x, z) {
  const agent = world.agents[agentId];
  if (!agent) return;
  wsSend({
    type: 'command',
    command: 'move_to',
    agent_id: agentId,
    x: x,
    y: z
  });
  addEvent('Moving ' + (agent.name || 'agent') + ' to (' + x.toFixed(0) + ', ' + z.toFixed(0) + ')');
}

function sendGatherCommand(agentId, resourceId) {
  const agent = world.agents[agentId];
  if (!agent) return;
  const resource = world.resources.find(r => r.id === resourceId);
  if (!resource) return;
  wsSend({
    type: 'command',
    command: 'gather',
    agent_id: agentId,
    resource_id: resourceId
  });
  addEvent('Ordered ' + (agent.name || 'agent') + ' to gather ' + (resource.kind || 'resource'));
}

// ── Helper: get ground intersection point ───────────────────────────────
function getGroundPoint(screenX, screenY) {
  const rect = container.getBoundingClientRect();
  const nx = ((screenX - rect.left) / rect.width) * 2 - 1;
  const ny = -((screenY - rect.top) / rect.height) * 2 + 1;
  const tempRay = new THREE.Raycaster();
  tempRay.setFromCamera(new THREE.Vector2(nx, ny), camera);
  const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const point = new THREE.Vector3();
  const hit = tempRay.ray.intersectPlane(groundPlane, point);
  return hit ? point : null;
}

// ── Click / Raycasting ─────────────────────────────────────────────────

function onPointerDown(event) {
  const rect = container.getBoundingClientRect();
  pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  mouse.x = event.clientX;
  mouse.y = event.clientY;
}

function onPointerUp(event) {
  const rect = container.getBoundingClientRect();
  const upX = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  const upY = -((event.clientY - rect.top) / rect.height) * 2 + 1;

  // Only process if it's a click (not a drag) — approximate
  const dx = event.clientX - mouse.x;
  const dy = event.clientY - mouse.y;
  if (Math.sqrt(dx * dx + dy * dy) > 8) return;

  raycaster.setFromCamera(new THREE.Vector2(upX, upY), camera);

  const clickables = getClickableObjects();
  const intersects = raycaster.intersectObjects(clickables, false);

  let hitAgent = null;
  let hitResource = null;
  let hitBuilding = null;

  for (const hit of intersects) {
    let obj = hit.object;
    // Walk up to find userData
    while (obj) {
      if (obj.userData && obj.userData.isAgent) {
        hitAgent = obj.userData.agentId;
        break;
      }
      if (obj.userData && obj.userData.isResource) {
        hitResource = obj.userData.resourceId;
        break;
      }
      if (obj.userData && obj.userData.isBuilding) {
        hitBuilding = obj.userData.buildingId;
        break;
      }
      obj = obj.parent;
    }
    if (hitAgent || hitResource || hitBuilding) break;
  }

  const isTouch = event.pointerType === 'touch';

  if (isTouch) {
    // ── Touch handling ──
    // Double-tap detection
    const now = Date.now();
    const timeSinceLast = now - lastTapTime;
    const distSinceLast = Math.sqrt(
      (event.clientX - lastTapX) ** 2 + (event.clientY - lastTapY) ** 2
    );
    lastTapTime = now;
    lastTapX = event.clientX;
    lastTapY = event.clientY;

    const isDoubleTap = timeSinceLast < DOUBLE_TAP_DELAY && distSinceLast < DOUBLE_TAP_DIST;

    if (isDoubleTap) {
      // Double-tap: zoom to location
      const pt = getGroundPoint(event.clientX, event.clientY);
      if (pt) {
        controls.target.set(pt.x, 0, pt.z);
        controls.update();
        addEvent('Zoomed to (' + pt.x.toFixed(0) + ', ' + pt.z.toFixed(0) + ')');
      }
      return;
    }

    // Single tap
    if (hitAgent && world.agents[hitAgent]) {
      // Tap on agent = select
      selectAgent(hitAgent);
    } else if (hitResource && selectedAgentId && world.agents[selectedAgentId]) {
      // Tap on resource with agent selected = gather
      sendGatherCommand(selectedAgentId, hitResource);
    } else if (selectedAgentId && world.agents[selectedAgentId]) {
      // Tap on ground with agent selected = move
      const pt = getGroundPoint(event.clientX, event.clientY);
      if (pt) {
        sendMoveCommand(selectedAgentId, pt.x, pt.z);
      }
    } else {
      // Tap on ground with no selection = deselect (no-op if already none)
      selectedAgentId = null;
      document.querySelectorAll('.agent-card.selected').forEach(e => e.classList.remove('selected'));
      updateScene();
    }
  } else {
    // ── Mouse handling (unchanged) ──
    // Left click: select
    if (event.button === 0) {
      if (hitAgent && world.agents[hitAgent]) {
        selectAgent(hitAgent);
      } else {
        // Click ground = deselect
        selectedAgentId = null;
        document.querySelectorAll('.agent-card.selected').forEach(e => e.classList.remove('selected'));
        updateScene();
      }
    }

    // Right click: command
    if (event.button === 2 && selectedAgentId && world.agents[selectedAgentId]) {
      const agent = world.agents[selectedAgentId];
      if (!agent) return;

      if (hitResource) {
        sendGatherCommand(selectedAgentId, hitResource);
      } else if (hitAgent) {
        // Click on another agent — could be attack in future, for now just select
        selectAgent(hitAgent);
      } else {
        // Move to ground position
        const pt = getGroundPoint(event.clientX, event.clientY);
        if (pt) {
          sendMoveCommand(selectedAgentId, pt.x, pt.z);
        }
      }
    }
  }
}

// ── WebSocket helpers ──────────────────────────────────────────────────

let ws = null;

function wsSend(msg) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(msg));
  }
}

function addEvent(text) {
  const el = document.createElement('div');
  el.textContent = text;
  eventLog.appendChild(el);
  while (eventLog.children.length > 50) eventLog.removeChild(eventLog.firstChild);
  eventLog.scrollTop = eventLog.scrollHeight;
}

function connectWebSocket() {
  const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = `${protocol}//${window.location.host}`;

  ws = new WebSocket(wsUrl);
  connStatus.className = 'connecting';

  ws.onopen = () => {
    connStatus.className = 'connected';
    addEvent('Connected to realm');
  };

  ws.onmessage = (event) => {
    try {
      const msg = JSON.parse(event.data);

      if (msg.type === 'state') {
        world = msg;
        updateScene();
        updateHUD();
      }
    } catch (e) {
      console.error('Failed to parse message', e);
    }
  };

  ws.onclose = () => {
    connStatus.className = 'disconnected';
    setTimeout(connectWebSocket, 2000);
  };

  ws.onerror = () => {
    ws.close();
  };
}

window.resetWorld = async function() {
  try {
    await fetch('/reset', { method: 'POST' });
    addEvent('World reset commanded');
  } catch (e) {
    console.error('Reset failed', e);
    addEvent('Reset failed: ' + e.message);
  }
};

// ── Event listeners ────────────────────────────────────────────────────

container.addEventListener('pointerdown', onPointerDown);
container.addEventListener('pointerup', onPointerUp);
container.addEventListener('contextmenu', (e) => e.preventDefault());

// Prevent default touch behaviors (scroll, zoom, long-press context menu)
container.addEventListener('touchstart', (e) => {
  if (e.target === container || e.target === renderer.domElement) {
    e.preventDefault();
  }
}, { passive: false });

container.addEventListener('touchmove', (e) => {
  if (e.target === container || e.target === renderer.domElement) {
    e.preventDefault();
  }
}, { passive: false });

// ── Animation loop ──────────────────────────────────────────────────────

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);

  // Update label positions every frame (they move with camera)
  const worldPos = new THREE.Vector3();
  for (const [id, obj] of agentMeshes) {
    if (obj.label && world.agents[id]) {
      const data = world.agents[id];
      worldPos.set(data.x, 0, data.z !== undefined ? data.z : data.y);
      updateLabelPosition(obj.label, worldPos);

      // Pulse selection ring
      if (id === selectedAgentId) {
        const group = obj.group;
        const glowRing = group.children.find(c => c.geometry && c.geometry.type === 'RingGeometry' && c.material.opacity !== undefined && c.material.color.getHex() === 0xffaa00);
        if (glowRing) {
          glowRing.material.opacity = 0.4 + 0.3 * Math.sin(Date.now() / 300);
        }
      }
    }
  }

  // Pulse target markers
  for (const [id, obj] of agentMeshes) {
    if (obj.targetMarker && obj.targetMarker.visible) {
      obj.targetMarker.rotation.y += 0.02;
      const pulse = 0.6 + 0.4 * Math.sin(Date.now() / 400);
      obj.targetMarker.children.forEach(child => {
        if (child.material) child.material.opacity = pulse;
      });
    }
  }
}

// ── Resize ──────────────────────────────────────────────────────────────

function resize() {
  const w = container.clientWidth;
  const h = container.clientHeight;
  const aspect = w / h;
  camera.left = -VIEW_FRUSTUM * aspect;
  camera.right = VIEW_FRUSTUM * aspect;
  camera.top = VIEW_FRUSTUM;
  camera.bottom = -VIEW_FRUSTUM;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}

window.addEventListener('resize', resize);
resize();
