<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dde8ee">
  <title>Age of Agents</title>
  <style>
    html, body { margin: 0; height: 100%; height: 100dvh; overflow: hidden; background: #cfe5f2; }
    /* 100dvh: on phones 100vh reaches under the browser's toolbar, hiding the
       bottom of the interface. */
    canvas#world { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; outline: none; }
    #loading {
      position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
      background: radial-gradient(circle at 50% 40%, #f4f0e2 0%, #cfe5f2 70%);
      font-family: "Nunito", system-ui, sans-serif; color: #3d4a52;
      transition: opacity 600ms ease;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .card { width: min(340px, 100%); text-align: center; }
    #loading h1 { margin: 0 0 6px; }
    #loading h1 img { display: block; width: 100%; height: auto; }
    #loading canvas { display: block; width: 240px; height: 240px; margin: 0 auto 14px; max-width: 70vw; max-height: 70vw; }
    #loading .bar {
      height: 10px; border-radius: 999px; overflow: hidden;
      background: rgba(255, 255, 255, 0.7); box-shadow: inset 0 0 0 1px rgba(47, 79, 99, 0.18);
    }
    #loading .fill {
      display: block; height: 100%; width: 0%; border-radius: inherit;
      background: linear-gradient(90deg, #c96f3b, #e3a04f); transition: width 250ms ease;
    }
    #loading p { margin: 12px 0 0; font-size: 14px; min-height: 1.4em; }
    #loading.failed .fill { background: #b5453a; }
  </style>
</head>
<body>
  <canvas id="world" tabindex="0" aria-label="Age of Agents island"></canvas>
  <div id="loading" role="status" aria-live="polite">
    <div class="card">
      <h1><img src="/assets/loading/title.webp" alt="Age of Agents" width="1600" height="279"></h1>
      <canvas class="build" aria-hidden="true"></canvas>
      <div class="bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span class="fill"></span>
      </div>
      <p>Loading the game</p>
    </div>
  </div>
  <script type="module">
    import init from '/web/pkg/aoa_client.js';

    const overlay = document.getElementById('loading');
    const bar = overlay.querySelector('.bar');
    const fill = overlay.querySelector('.fill');
    const label = overlay.querySelector('p');

    // Called by the Rust client: (fraction, text) while loading, (1) once the
    // first world frame is drawn.
    window.aoaProgress = (fraction, text) => {
      const percent = Math.round(Math.min(1, fraction) * 100);
      fill.style.width = percent + '%';
      bar.setAttribute('aria-valuenow', String(percent));
      if (text) label.textContent = text;
      if (fraction >= 1 && text === undefined) {
        overlay.classList.add('done');
        setTimeout(() => overlay.remove(), 700);
      }
    };

    // Buildings rising on the island while the game loads: each one climbs
    // through its four stages, then the next building takes its place.
    async function animateBuildings() {
      const canvas = overlay.querySelector('canvas.build');
      const sheet = await (await fetch('/assets/loading/buildings.json')).json();
      const image = new Image();
      image.src = '/assets/loading/' + sheet.image;
      await image.decode();
      const names = Object.keys(sheet.frames);
      const scale = window.devicePixelRatio || 1;
      canvas.width = canvas.height = Math.round(240 * scale);
      const context = canvas.getContext('2d');
      const STAGE = 650, HOLD = 1100, FADE = 250;
      const cycle = 3 * STAGE + HOLD + 2 * FADE;
      const draw = (rect, alpha) => {
        context.globalAlpha = alpha;
        context.drawImage(image, rect[0], rect[1], rect[2], rect[3], 0, 0, canvas.width, canvas.height);
      };
      const start = performance.now();
      const frame = now => {
        if (!overlay.isConnected) return;
        const elapsed = Math.max(0, now - start);
        const stages = sheet.frames[names[Math.floor(elapsed / cycle) % names.length]];
        let t = elapsed % cycle;
        context.clearRect(0, 0, canvas.width, canvas.height);
        if (t < FADE) {
          draw(stages[0], t / FADE);
        } else if ((t -= FADE) < 3 * STAGE) {
          // Each stage blends into the next over the last quarter of its time.
          const stage = Math.floor(t / STAGE), blend = Math.max(0, (t % STAGE) / STAGE - 0.75) * 4;
          draw(stages[stage], 1);
          if (blend > 0) draw(stages[stage + 1], blend);
        } else if ((t -= 3 * STAGE) < HOLD) {
          draw(stages[3], 1);
        } else {
          draw(stages[3], 1 - (t - HOLD) / FADE);
        }
        requestAnimationFrame(frame);
      };
      requestAnimationFrame(frame);
    }
    animateBuildings().catch(error => console.warn('loading art', error));

    // The game code is the largest download; stream it to show progress.
    // A compressed response has no usable length, so the bar then eases
    // toward its share instead.
    async function download(url) {
      const response = await fetch(url);
      if (!response.ok || !response.body) throw new Error(`${url}: ${response.status}`);
      const length = response.headers.get('content-encoding')
        ? 0 : Number(response.headers.get('content-length')) || 0;
      const reader = response.body.getReader();
      const chunks = [];
      let received = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
        const share = length ? received / length : 1 - Math.exp(-received / 2e6);
        window.aoaProgress(0.4 * share, `Loading the game (${(received / 1e6).toFixed(1)} MB)`);
      }
      const bytes = new Uint8Array(received);
      let offset = 0;
      for (const chunk of chunks) { bytes.set(chunk, offset); offset += chunk.length; }
      return bytes;
    }

    try {
      const wasm = await download('/web/pkg/aoa_client_bg.wasm');
      window.aoaProgress(0.4, 'Painting the island');
      await init({ module_or_path: wasm });
    } catch (error) {
      overlay.classList.add('failed');
      label.textContent = 'The game could not load. Reload to try again.';
      console.error(error);
    }
  </script>
</body>
</html>
